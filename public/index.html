<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>SEE YA.</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #08090f;
            --ink: #f7f3e8;
            --muted: #a7b0bd;
            --teal: #38f5d5;
            --amber: #ffb84d;
            --rose: #ff4f8a;
            --blue: #5ba7ff;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;
            background:
                radial-gradient(circle at 18% 18%, rgba(56, 245, 213, 0.16), transparent 28rem),
                radial-gradient(circle at 82% 16%, rgba(255, 79, 138, 0.14), transparent 24rem),
                radial-gradient(circle at 72% 84%, rgba(255, 184, 77, 0.15), transparent 26rem),
                linear-gradient(145deg, #05060a 0%, #0b1020 46%, #05060a 100%);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body::before,
        body::after {
            position: fixed;
            inset: 0;
            pointer-events: none;
            content: "";
        }

        body::before {
            z-index: 1;
            opacity: 0.38;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
            background-size: 72px 72px;
            mask-image: radial-gradient(circle at center, black 0 48%, transparent 78%);
            animation: grid-drift 18s linear infinite;
        }

        body::after {
            z-index: 9;
            opacity: 0.12;
            background-image: repeating-linear-gradient(
                0deg,
                transparent 0,
                transparent 2px,
                rgba(255, 255, 255, 0.35) 3px
            );
            mix-blend-mode: overlay;
        }

        canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
        }

        .stage {
            position: relative;
            z-index: 2;
            display: grid;
            min-height: 100dvh;
            place-items: center;
            padding: clamp(20px, 4vw, 56px);
            isolation: isolate;
        }

        .halo {
            position: absolute;
            width: min(72vw, 720px);
            aspect-ratio: 1;
            border-radius: 50%;
            background:
                conic-gradient(from 90deg, transparent, rgba(56, 245, 213, 0.68), transparent, rgba(255, 184, 77, 0.58), transparent, rgba(255, 79, 138, 0.62), transparent),
                radial-gradient(circle, transparent 0 52%, rgba(255, 255, 255, 0.12) 53%, transparent 56%);
            filter: blur(0.4px) drop-shadow(0 0 48px rgba(56, 245, 213, 0.16));
            opacity: 0.8;
            animation: spin 16s linear infinite, breathe 5.5s ease-in-out infinite;
        }

        .halo::before,
        .halo::after {
            position: absolute;
            inset: 9%;
            border: 1px solid rgba(247, 243, 232, 0.15);
            border-radius: inherit;
            content: "";
            animation: orbit 7.5s ease-in-out infinite;
        }

        .halo::after {
            inset: 21%;
            border-color: rgba(56, 245, 213, 0.28);
            animation-duration: 9s;
            animation-direction: reverse;
        }

        .content {
            position: relative;
            display: grid;
            justify-items: center;
            gap: clamp(18px, 3vw, 28px);
            width: min(100%, 980px);
            text-align: center;
        }

        .signal {
            display: inline-grid;
            grid-auto-flow: column;
            align-items: center;
            gap: 10px;
            min-height: 34px;
            padding: 8px 13px;
            border: 1px solid rgba(247, 243, 232, 0.16);
            border-radius: 999px;
            background: rgba(8, 9, 15, 0.42);
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            backdrop-filter: blur(18px);
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.24);
        }

        .pulse {
            width: 9px;
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--teal);
            box-shadow: 0 0 0 0 rgba(56, 245, 213, 0.65), 0 0 22px rgba(56, 245, 213, 0.8);
            animation: pulse 1.55s ease-out infinite;
        }

        h1 {
            position: relative;
            margin: 0;
            max-width: 100%;
            font-size: clamp(4.6rem, 17vw, 13rem);
            font-weight: 950;
            line-height: 0.82;
            letter-spacing: 0;
            text-transform: uppercase;
            text-wrap: balance;
            text-shadow:
                0 0 24px rgba(247, 243, 232, 0.18),
                0 26px 80px rgba(0, 0, 0, 0.52);
            animation: title-float 4.8s ease-in-out infinite;
        }

        h1::before,
        h1::after {
            position: absolute;
            inset: 0;
            content: attr(data-text);
            pointer-events: none;
            mix-blend-mode: screen;
        }

        h1::before {
            color: var(--teal);
            transform: translate(-0.035em, -0.025em);
            clip-path: inset(0 0 52% 0);
            animation: glitch-a 3.6s steps(1, end) infinite;
        }

        h1::after {
            color: var(--rose);
            transform: translate(0.032em, 0.022em);
            clip-path: inset(54% 0 0 0);
            animation: glitch-b 4.3s steps(1, end) infinite;
        }

        .subline {
            display: grid;
            grid-auto-flow: column;
            align-items: center;
            gap: clamp(10px, 2vw, 18px);
            color: rgba(247, 243, 232, 0.72);
            font-size: clamp(0.86rem, 2vw, 1rem);
            font-weight: 700;
            text-transform: uppercase;
        }

        .bar {
            width: clamp(48px, 12vw, 132px);
            height: 2px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(247, 243, 232, 0.16);
        }

        .bar::before {
            display: block;
            width: 55%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--teal), var(--amber), var(--rose));
            content: "";
            animation: scan 1.45s ease-in-out infinite alternate;
        }

        .rings {
            position: fixed;
            right: clamp(18px, 4vw, 54px);
            bottom: clamp(18px, 4vw, 54px);
            z-index: 3;
            display: grid;
            width: clamp(78px, 13vw, 128px);
            aspect-ratio: 1;
            place-items: center;
            opacity: 0.8;
        }

        .rings span {
            position: absolute;
            border: 1px solid rgba(247, 243, 232, 0.18);
            border-radius: 50%;
            animation: ripple 2.8s ease-out infinite;
        }

        .rings span:nth-child(1) {
            inset: 38%;
            border-color: rgba(56, 245, 213, 0.58);
        }

        .rings span:nth-child(2) {
            inset: 24%;
            animation-delay: 0.45s;
        }

        .rings span:nth-child(3) {
            inset: 10%;
            border-color: rgba(255, 184, 77, 0.4);
            animation-delay: 0.9s;
        }

        .corner {
            position: fixed;
            z-index: 3;
            width: clamp(54px, 9vw, 104px);
            height: clamp(54px, 9vw, 104px);
            opacity: 0.58;
        }

        .corner::before,
        .corner::after {
            position: absolute;
            background: rgba(247, 243, 232, 0.54);
            content: "";
        }

        .corner::before {
            width: 100%;
            height: 1px;
        }

        .corner::after {
            width: 1px;
            height: 100%;
        }

        .corner.top {
            top: clamp(18px, 4vw, 54px);
            left: clamp(18px, 4vw, 54px);
        }

        .corner.bottom {
            right: clamp(18px, 4vw, 54px);
            bottom: clamp(18px, 4vw, 54px);
            transform: rotate(180deg);
        }

        @keyframes grid-drift {
            to {
                background-position: 72px 72px;
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes breathe {
            0%,
            100% {
                scale: 0.94;
            }

            50% {
                scale: 1.04;
            }
        }

        @keyframes orbit {
            0%,
            100% {
                transform: rotateX(62deg) rotateZ(0deg);
            }

            50% {
                transform: rotateX(62deg) rotateZ(180deg) scale(1.08);
            }
        }

        @keyframes pulse {
            to {
                box-shadow: 0 0 0 12px rgba(56, 245, 213, 0), 0 0 22px rgba(56, 245, 213, 0.8);
            }
        }

        @keyframes title-float {
            0%,
            100% {
                transform: translateY(0) rotate(-0.35deg);
            }

            50% {
                transform: translateY(-10px) rotate(0.35deg);
            }
        }

        @keyframes glitch-a {
            0%,
            86%,
            100% {
                transform: translate(-0.035em, -0.025em);
            }

            88% {
                transform: translate(0.055em, -0.01em);
            }

            91% {
                transform: translate(-0.08em, 0.018em);
            }
        }

        @keyframes glitch-b {
            0%,
            78%,
            100% {
                transform: translate(0.032em, 0.022em);
            }

            80% {
                transform: translate(-0.06em, 0.03em);
            }

            83% {
                transform: translate(0.075em, -0.015em);
            }
        }

        @keyframes scan {
            from {
                transform: translateX(-38%);
            }

            to {
                transform: translateX(122%);
            }
        }

        @keyframes ripple {
            0% {
                opacity: 0.95;
                transform: scale(0.78);
            }

            100% {
                opacity: 0;
                transform: scale(1.18);
            }
        }

        @media (max-width: 560px) {
            .signal {
                letter-spacing: 0.14em;
            }

            .subline {
                grid-auto-flow: row;
                gap: 12px;
            }

            .bar {
                width: 116px;
            }

            .corner.bottom,
            .rings {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <canvas id="particles" aria-hidden="true"></canvas>
    <span class="corner top" aria-hidden="true"></span>
    <span class="corner bottom" aria-hidden="true"></span>

    <main class="stage">
        <div class="halo" aria-hidden="true"></div>
        <section class="content" aria-label="Maintenance">
            <div class="signal"><span class="pulse" aria-hidden="true"></span>Maintenance Mode</div>
            <h1 data-text="SEE YA.">SEE YA.</h1>
            <div class="subline" aria-hidden="true">
                <span class="bar"></span>
                <span>System Offline</span>
                <span class="bar"></span>
            </div>
        </section>
    </main>

    <div class="rings" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <script>
        (() => {
            const canvas = document.getElementById("particles");
            const ctx = canvas.getContext("2d");
            const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            const pointer = { x: 0, y: 0, active: false };
            let particles = [];
            let width = 0;
            let height = 0;
            let frame = 0;

            const colors = ["#38f5d5", "#ffb84d", "#ff4f8a", "#5ba7ff", "#f7f3e8"];

            const resize = () => {
                const ratio = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = Math.floor(width * ratio);
                canvas.height = Math.floor(height * ratio);
                canvas.style.width = `${width}px`;
                canvas.style.height = `${height}px`;
                ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

                const count = reduceMotion ? 28 : Math.min(120, Math.max(58, Math.floor(width * height / 12500)));
                particles = Array.from({ length: count }, (_, index) => ({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    base: 0.8 + Math.random() * 2.8,
                    size: 0.8 + Math.random() * 2.4,
                    vx: (Math.random() - 0.5) * 0.42,
                    vy: (Math.random() - 0.5) * 0.42,
                    color: colors[index % colors.length],
                    phase: Math.random() * Math.PI * 2
                }));
            };

            const draw = () => {
                frame += 0.012;
                ctx.clearRect(0, 0, width, height);
                ctx.globalCompositeOperation = "lighter";

                for (const particle of particles) {
                    const dx = pointer.x - particle.x;
                    const dy = pointer.y - particle.y;
                    const distance = Math.hypot(dx, dy);

                    if (pointer.active && distance < 170) {
                        particle.x -= dx * 0.006;
                        particle.y -= dy * 0.006;
                    }

                    if (!reduceMotion) {
                        particle.x += particle.vx + Math.cos(frame + particle.phase) * 0.16;
                        particle.y += particle.vy + Math.sin(frame + particle.phase) * 0.16;
                    }

                    if (particle.x < -20) particle.x = width + 20;
                    if (particle.x > width + 20) particle.x = -20;
                    if (particle.y < -20) particle.y = height + 20;
                    if (particle.y > height + 20) particle.y = -20;

                    const shimmer = particle.base + Math.sin(frame * 3 + particle.phase) * 0.55;
                    ctx.beginPath();
                    ctx.fillStyle = particle.color;
                    ctx.globalAlpha = 0.32;
                    ctx.arc(particle.x, particle.y, Math.max(0.4, shimmer * particle.size), 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.globalAlpha = 0.1;
                ctx.lineWidth = 1;
                for (let i = 0; i < particles.length; i += 1) {
                    for (let j = i + 1; j < particles.length; j += 1) {
                        const a = particles[i];
                        const b = particles[j];
                        const distance = Math.hypot(a.x - b.x, a.y - b.y);
                        if (distance < 92) {
                            ctx.strokeStyle = a.color;
                            ctx.globalAlpha = (92 - distance) / 1100;
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(b.x, b.y);
                            ctx.stroke();
                        }
                    }
                }

                requestAnimationFrame(draw);
            };

            window.addEventListener("resize", resize);
            window.addEventListener("pointermove", (event) => {
                pointer.x = event.clientX;
                pointer.y = event.clientY;
                pointer.active = true;
            });
            window.addEventListener("pointerleave", () => {
                pointer.active = false;
            });

            resize();
            draw();
        })();
    </script>
</body>
</html>
